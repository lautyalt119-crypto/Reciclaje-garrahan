<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reciclaje Game</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont;
    background: #f5f0e6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* PANTALLA INICIO */
.start {
    text-align: center;
}

.start button {
    padding: 15px 30px;
    border: none;
    border-radius: 20px;
    background: #6b8e23;
    color: white;
    font-size: 1.2rem;
}

/* JUEGO */
.game {
    display: none;
    width: 90%;
    max-width: 400px;
    text-align: center;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 30px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    transition: all 0.4s ease;
}

.card.animate {
    transform: scale(0.95);
    opacity: 0;
}

img {
    width: 120px;
    margin-bottom: 10px;
}

.buttons {
    display: flex;
    gap: 10px;
}

button {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 20px;
    font-size: 1rem;
}

.yes { background: #6b8e23; color: white; }
.no { background: #c94c4c; color: white; }

.info {
    min-height: 40px;
    margin-top: 10px;
}

/* PARTICULAS */
.particle {
    position: fixed;
    width: 8px;
    height: 8px;
    background: green;
    border-radius: 50%;
    pointer-events: none;
    animation: explode 0.8s ease forwards;
}

@keyframes explode {
    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- INICIO -->
<div class="start" id="startScreen">
    <h1>♻️ Reciclaje Game</h1>
    <p>Mejor puntaje: <span id="best">0</span></p>
    <button onclick="startGame()">Jugar</button>
</div>

<!-- JUEGO -->
<div class="game" id="gameScreen">
    <h3>Puntos: <span id="score">0</span></h3>

    <div class="card" id="card">
        <img id="image">
        <h2 id="item"></h2>
    </div>

    <div class="buttons">
        <button class="yes" onclick="answer(true)">♻️</button>
        <button class="no" onclick="answer(false)">🗑</button>
    </div>

    <div class="info" id="info"></div>
</div>

<script>
// 🖼 ITEMS (EDITABLES)
const items = [
    {
        name: "Botella plástica",
        recyclable: true,
        info: "El plástico PET es reciclable",
        img: "botella.png"
    },
    {
        name: "Vidrio",
        recyclable: true,
        info: "El vidrio es 100% reciclable",
        img: "vidrio.png"
    },
    {
        name: "Caja de pizza sucia",
        recyclable: false,
        info: "La grasa contamina el reciclaje",
        img: "pizza.png"
    },
    {
        name: "Tetra Pak",
        recyclable: true,
        info: "Reciclable con tratamiento especial",
        img: "tetrapak.png"
    },
    {
        name: "Servilleta usada",
        recyclable: false,
        info: "El papel sucio no se recicla",
        img: "servilleta.png"
    }
];

// 🔊 sonidos
const correctSound = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");
const wrongSound = new Audio("https://www.soundjay.com/buttons/sounds/button-10.mp3");

// estado
let score = 0;
let best = localStorage.getItem("bestScore") || 0;
let current;
let history = [];
let difficulty = 1;

// UI
document.getElementById("best").textContent = best;

// iniciar
function startGame() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    newItem();
}

// nuevo item
function newItem() {
    let available = items.filter(i => !history.includes(i));

    if (available.length === 0) {
        history = [];
        available = items;
    }

    current = available[Math.floor(Math.random() * available.length)];

    history.push(current);
    if (history.length > 3) history.shift();

    document.getElementById("item").textContent = current.name;
    document.getElementById("image").src = current.img;
    document.getElementById("info").textContent = "";
}

// partículas
function particles() {
    for (let i = 0; i < 15; i++) {
        let p = document.createElement("div");
        p.className = "particle";

        p.style.left = "50%";
        p.style.top = "50%";

        p.style.setProperty("--x", (Math.random()*200-100)+"px");
        p.style.setProperty("--y", (Math.random()*200-100)+"px");

        document.body.appendChild(p);

        setTimeout(() => p.remove(), 800);
    }
}

// responder
function answer(choice) {
    if (choice === current.recyclable) {
        score++;
        difficulty += 0.1;

        document.getElementById("score").textContent = score;
        document.getElementById("info").textContent = "✅ " + current.info;

        correctSound.play();
        particles();

        setTimeout(newItem, 700);

    } else {
        wrongSound.play();

        if (navigator.vibrate) navigator.vibrate([200,100,200]);

        document.getElementById("info").textContent = "❌ " + current.info;

        setTimeout(() => {
            if (score > best) {
                localStorage.setItem("bestScore", score);
            }
            alert("Game Over 💀 Puntaje: " + score);
            location.reload();
        }, 1000);
    }
}
</script>

</body>
</html>
