<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f0e6">
<title>Reciclaje Game</title>

<link rel="stylesheet" href="style.css">

<!-- 🔥 CLAVE: defer -->
<script src="script.js" defer></script>
</head>

<body>

<div class="start" id="startScreen">
    <h1>♻️ Reciclaje Game</h1>
    <p>Mejor puntaje: <span id="best">0</span></p>
    <button onclick="startGame()">Jugar</button>
</div>

<div class="game" id="gameScreen">
    <h3>Puntos: <span id="score">0</span></h3>

    <div class="card" id="card">
        <img id="image">
        <h2 id="item"></h2>
    </div>

    <div class="buttons">
        <button class="yes" onclick="answer(true)">♻️</button>
        <button class="no" onclick="answer(false)">🗑</button>
    </div>

    <div class="info" id="info"></div>
</div>

</body>
</html>
