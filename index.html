<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reciclaje Game</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont;
    background: #f5f0e6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.game {
    width: 90%;
    max-width: 400px;
    text-align: center;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 30px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    transition: all 0.4s ease;
}

.card.animate {
    transform: scale(0.95);
    opacity: 0;
}

img {
    width: 120px;
    margin-bottom: 10px;
}

.score {
    margin-bottom: 15px;
    opacity: 0.6;
}

.buttons {
    display: flex;
    gap: 10px;
}

button {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 20px;
    font-size: 1rem;
    transition: 0.2s;
}

.yes { background: #6b8e23; color: white; }
.no { background: #c94c4c; color: white; }

button:active {
    transform: scale(0.95);
}

.info {
    margin-top: 10px;
    font-size: 0.9rem;
    opacity: 0.7;
    min-height: 40px;
}
</style>
</head>

<body>

<div class="game">
    <div class="score">Puntos: <span id="score">0</span></div>

    <div class="card" id="card">
        <img id="image" src="" alt="">
        <h2 id="item"></h2>
    </div>

    <div class="buttons">
        <button class="yes" onclick="answer(true)">♻️</button>
        <button class="no" onclick="answer(false)">🗑</button>
    </div>

    <div class="info" id="info"></div>
</div>

<script>
const items = [
    {
        name: "Botella plástica",
        recyclable: true,
        info: "El plástico PET es reciclable",
        img: "https://cdn-icons-png.flaticon.com/512/1046/1046857.png"
    },
    {
        name: "Vidrio",
        recyclable: true,
        info: "El vidrio es 100% reciclable",
        img: "https://cdn-icons-png.flaticon.com/512/1046/1046870.png"
    },
    {
        name: "Caja de pizza sucia",
        recyclable: false,
        info: "La grasa contamina el reciclaje",
        img: "https://cdn-icons-png.flaticon.com/512/3595/3595455.png"
    },
    {
        name: "Tetra Pak",
        recyclable: true,
        info: "Es reciclable pero requiere procesos especiales",
        img: "https://cdn-icons-png.flaticon.com/512/3081/3081559.png"
    },
    {
        name: "Servilleta usada",
        recyclable: false,
        info: "El papel sucio no se recicla",
        img: "https://cdn-icons-png.flaticon.com/512/2933/2933827.png"
    }
];

let score = 0;
let current;
let history = []; // 🔥 cooldown

// 🔊 sonidos
let correctSound = new Audio("https://www.soundjay.com/buttons/sounds/button-3.mp3");
let wrongSound = new Audio("https://www.soundjay.com/buttons/sounds/button-10.mp3");

function newItem() {
    let available = items.filter(i => !history.includes(i));

    if (available.length === 0) {
        history = [];
        available = items;
    }

    current = available[Math.floor(Math.random() * available.length)];

    history.push(current);
    if (history.length > 3) history.shift(); // 🔥 cooldown = 3 turnos

    document.getElementById("item").textContent = current.name;
    document.getElementById("image").src = current.img;
    document.getElementById("info").textContent = "";
}

function answer(choice) {
    const card = document.getElementById("card");

    if (choice === current.recyclable) {
        score++;
        document.getElementById("score").textContent = score;

        correctSound.currentTime = 0;
        correctSound.play();

        document.getElementById("info").textContent = "✅ " + current.info;

        card.classList.add("animate");

        setTimeout(() => {
            card.classList.remove("animate");
            newItem();
        }, 800);

    } else {
        wrongSound.currentTime = 0;
        wrongSound.play();

        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

        document.getElementById("info").textContent = "❌ " + current.info;

        setTimeout(() => {
            alert("Game Over 💀 Puntaje: " + score);
            score = 0;
            document.getElementById("score").textContent = score;
            newItem();
        }, 1000);
    }
}

newItem();
</script>

</body>
</html>
